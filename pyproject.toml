[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grover-rudolph-qae-benchmark"
version = "0.1.0"
description = "Benchmarks for Grover-Rudolph state preparation and QAE numerical integration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "qiskit>=1.0",
  "qiskit-ibm-runtime>=0.20",
]

[project.optional-dependencies]
simulation = [
  "qiskit-aer>=0.14",
]
dev = [
  "pytest>=8",
]
plotting = [
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
